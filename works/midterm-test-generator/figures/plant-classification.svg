<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <!-- ボックスのスタイル定義 -->
  <defs>
    <style>
      .pc-box  { fill: #fafafa; stroke: #455a64; stroke-width: 1.5; rx: 6; }
      .pc-text { fill: #263238; font-size: 14px; text-anchor: middle;
                 dominant-baseline: middle;
                 font-family: -apple-system, "Hiragino Sans", sans-serif; }
      .pc-line { stroke: #607d8b; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- レベル1：植物 -->
  <rect x="290" y="20" width="120" height="36" class="pc-box"/>
  <text x="350" y="38" class="pc-text">植物</text>

  <!-- 分岐線 (植物 → 種子植物 / 種子をつくらない植物) -->
  <path d="M 350 56 L 350 80 L 180 80 L 180 100" class="pc-line"/>
  <path d="M 350 80 L 520 80 L 520 100" class="pc-line"/>

  <!-- レベル2：種子植物 -->
  <rect x="100" y="100" width="160" height="36" class="pc-box"/>
  <text x="180" y="118" class="pc-text">種子植物</text>

  <!-- レベル2：種子をつくらない植物 -->
  <rect x="430" y="100" width="180" height="36" class="pc-box"/>
  <text x="520" y="118" class="pc-text">種子をつくらない植物</text>

  <!-- 分岐線 (種子植物 → 被子植物 / 裸子植物) -->
  <path d="M 180 136 L 180 160 L 90 160 L 90 180" class="pc-line"/>
  <path d="M 180 160 L 270 160 L 270 180" class="pc-line"/>

  <!-- 分岐線 (種子をつくらない → シダ / コケ) -->
  <path d="M 520 136 L 520 160 L 450 160 L 450 180" class="pc-line"/>
  <path d="M 520 160 L 590 160 L 590 180" class="pc-line"/>

  <!-- レベル3：被子植物 -->
  <rect x="30" y="180" width="120" height="36" class="pc-box"/>
  <text x="90" y="198" class="pc-text">被子植物</text>

  <!-- レベル3：裸子植物 -->
  <rect x="210" y="180" width="120" height="36" class="pc-box"/>
  <text x="270" y="198" class="pc-text">裸子植物</text>

  <!-- レベル3：シダ植物 -->
  <rect x="390" y="180" width="120" height="36" class="pc-box"/>
  <text x="450" y="198" class="pc-text">シダ植物</text>

  <!-- レベル3：コケ植物 -->
  <rect x="530" y="180" width="120" height="36" class="pc-box"/>
  <text x="590" y="198" class="pc-text">コケ植物</text>

  <!-- 分岐線 (被子植物 → 双子葉類 / 単子葉類) -->
  <path d="M 90 216 L 90 240 L 40 240 L 40 270" class="pc-line"/>
  <path d="M 90 240 L 140 240 L 140 270" class="pc-line"/>

  <!-- レベル4：双子葉類 -->
  <rect x="-10" y="270" width="100" height="36" class="pc-box"/>
  <text x="40" y="288" class="pc-text">双子葉類</text>

  <!-- レベル4：単子葉類 -->
  <rect x="90" y="270" width="100" height="36" class="pc-box"/>
  <text x="140" y="288" class="pc-text">単子葉類</text>

  <!-- 分岐線 (双子葉類 → 合弁花類 / 離弁花類) -->
  <path d="M 40 306 L 40 340 L -10 340 L -10 370" class="pc-line"/>
  <path d="M 40 340 L 90 340 L 90 370" class="pc-line"/>

  <!-- レベル5：合弁花類 -->
  <rect x="-60" y="370" width="100" height="36" class="pc-box"/>
  <text x="-10" y="388" class="pc-text">合弁花類</text>

  <!-- レベル5：離弁花類 -->
  <rect x="40" y="370" width="100" height="36" class="pc-box"/>
  <text x="90" y="388" class="pc-text">離弁花類</text>

  <!-- 凡例：例の植物（任意、参考表示） -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#607d8b">
    <text x="270" y="240" text-anchor="middle">例：マツ・スギ・イチョウ</text>
    <text x="450" y="240" text-anchor="middle">例：イヌワラビ・スギナ</text>
    <text x="590" y="240" text-anchor="middle">例：ゼニゴケ・スギゴケ</text>
    <text x="140" y="330" text-anchor="middle">例：イネ・トウモロコシ</text>
    <text x="-10" y="430" text-anchor="middle">例：アサガオ・タンポポ</text>
    <text x="90"  y="430" text-anchor="middle">例：サクラ・アブラナ</text>
  </g>

  <!-- 注釈：分類の判別軸（右側に小さく） -->
  <g font-family="-apple-system, sans-serif" font-size="11" fill="#90a4ae">
    <text x="660" y="118" text-anchor="end">← 種子の有無</text>
    <text x="350" y="160" text-anchor="middle">↓ 胚珠が子房に包まれているか</text>
    <text x="195" y="240" text-anchor="middle">↓ 子葉の数</text>
    <text x="160" y="340" text-anchor="middle">↓ 花弁のつき方</text>
  </g>
</svg>
