<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <!-- ── 地面線 ── -->
  <line x1="20" y1="270" x2="480" y2="270" stroke="#8d6e63" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- ── 左：雌株（さく+柄） ── -->

  <!-- 仮根 -->
  <g stroke="#a1887f" stroke-width="1.2" fill="none">
    <path d="M 130 280 Q 120 305 110 330"/>
    <path d="M 135 280 Q 132 305 128 330"/>
    <path d="M 140 280 Q 145 305 150 330"/>
    <path d="M 145 280 Q 155 305 165 330"/>
  </g>

  <!-- 葉状体（根元の小さな葉群） -->
  <g fill="#aed581" stroke="#33691e" stroke-width="1.2">
    <ellipse cx="115" cy="265" rx="14" ry="6"/>
    <ellipse cx="135" cy="262" rx="16" ry="6"/>
    <ellipse cx="155" cy="265" rx="14" ry="6"/>
    <ellipse cx="125" cy="255" rx="12" ry="5"/>
    <ellipse cx="145" cy="255" rx="12" ry="5"/>
  </g>

  <!-- 柄（さくを支える長い茎） -->
  <line x1="135" y1="253" x2="135" y2="120" stroke="#9b8b62" stroke-width="2"/>

  <!-- さく（柄の先端の胞子のう袋） -->
  <ellipse cx="135" cy="105" rx="14" ry="20"
           fill="#bcaaa4" stroke="#5d4037" stroke-width="1.5"/>
  <!-- さくの帽 -->
  <path d="M 122 88 Q 135 78 148 88 L 145 95 Q 135 92 125 95 Z"
        fill="#8d6e63" stroke="#5d4037" stroke-width="1.3"/>

  <!-- ラベル -->
  <text x="135" y="320" text-anchor="middle"
        font-size="15" fill="#33691e" font-weight="bold"
        font-family="-apple-system, sans-serif">A</text>

  <!-- ── 中央：分離線 ── -->
  <line x1="260" y1="40" x2="260" y2="340" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ── 右：雄株（雄器） ── -->

  <!-- 仮根 -->
  <g stroke="#a1887f" stroke-width="1.2" fill="none">
    <path d="M 360 280 Q 350 305 340 330"/>
    <path d="M 365 280 Q 362 305 358 330"/>
    <path d="M 370 280 Q 375 305 380 330"/>
    <path d="M 375 280 Q 385 305 395 330"/>
  </g>

  <!-- 葉状体 -->
  <g fill="#aed581" stroke="#33691e" stroke-width="1.2">
    <ellipse cx="345" cy="265" rx="14" ry="6"/>
    <ellipse cx="365" cy="262" rx="16" ry="6"/>
    <ellipse cx="385" cy="265" rx="14" ry="6"/>
    <ellipse cx="355" cy="255" rx="12" ry="5"/>
    <ellipse cx="375" cy="255" rx="12" ry="5"/>
  </g>

  <!-- 茎（雄株は柄が短く、雄器が頂部に直接） -->
  <line x1="365" y1="253" x2="365" y2="200" stroke="#558b2f" stroke-width="2"/>

  <!-- 雄器（盃状の上端、上向きに開く） -->
  <path d="M 340 200 Q 365 175 390 200 Q 365 215 340 200 Z"
        fill="#f9a825" stroke="#7a5a20" stroke-width="1.5"/>
  <!-- 精子（点群） -->
  <g fill="#7a5a20">
    <circle cx="355" cy="195" r="1.5"/>
    <circle cx="365" cy="192" r="1.5"/>
    <circle cx="375" cy="195" r="1.5"/>
    <circle cx="360" cy="200" r="1.5"/>
    <circle cx="370" cy="200" r="1.5"/>
  </g>

  <!-- ラベル -->
  <text x="365" y="320" text-anchor="middle"
        font-size="15" fill="#7a5a20" font-weight="bold"
        font-family="-apple-system, sans-serif">B</text>
</svg>
