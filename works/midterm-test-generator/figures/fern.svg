<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- ── 地面線 ── -->
  <line x1="20" y1="280" x2="380" y2="280" stroke="#8d6e63" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- ── 地下茎（横に伸びる） ── -->
  <path d="M 80 310 Q 160 295 240 320" stroke="#6d4c2e" stroke-width="6" fill="none"/>

  <!-- ── 根（地下茎から下方に） ── -->
  <g stroke="#a1887f" stroke-width="1.5" fill="none">
    <path d="M 100 318 Q 95 350 90  385"/>
    <path d="M 140 313 Q 145 350 155 385"/>
    <path d="M 180 308 Q 175 350 170 385"/>
    <path d="M 220 313 Q 230 350 235 385"/>
  </g>

  <!-- ── 葉柄（地下茎から上に伸びる） ── -->
  <line x1="160" y1="298" x2="160" y2="80" stroke="#558b2f" stroke-width="4"/>

  <!-- ── 葉（羽状複葉、左右対称） ── -->
  <!-- 中央葉軸 -->
  <line x1="160" y1="80" x2="160" y2="240" stroke="#33691e" stroke-width="2"/>

  <!-- 小葉（羽片）— 左右対称で複数段 -->
  <g fill="#c5e1a5" stroke="#33691e" stroke-width="1.3">
    <!-- 最上段 -->
    <path d="M 160 85 Q 130 78 115 88 Q 130 95 160 92 Z"/>
    <path d="M 160 85 Q 190 78 205 88 Q 190 95 160 92 Z"/>
    <!-- 段2 -->
    <path d="M 160 110 Q 120 100 100 115 Q 125 122 160 117 Z"/>
    <path d="M 160 110 Q 200 100 220 115 Q 195 122 160 117 Z"/>
    <!-- 段3 -->
    <path d="M 160 140 Q 110 128 85 145 Q 120 155 160 148 Z"/>
    <path d="M 160 140 Q 210 128 235 145 Q 200 155 160 148 Z"/>
    <!-- 段4（最も大きい） -->
    <path d="M 160 170 Q 105 158 75 180 Q 115 192 160 180 Z"/>
    <path d="M 160 170 Q 215 158 245 180 Q 205 192 160 180 Z"/>
    <!-- 段5 -->
    <path d="M 160 200 Q 110 190 90 210 Q 120 220 160 210 Z"/>
    <path d="M 160 200 Q 210 190 230 210 Q 200 220 160 210 Z"/>
    <!-- 段6（小） -->
    <path d="M 160 225 Q 125 218 110 230 Q 130 240 160 232 Z"/>
    <path d="M 160 225 Q 195 218 210 230 Q 190 240 160 232 Z"/>
  </g>

  <!-- ── 胞子のう（葉裏の小さな点群、右下の小葉あたり） ── -->
  <g fill="#5d4037" stroke="none">
    <circle cx="195" cy="183" r="2"/>
    <circle cx="205" cy="185" r="2"/>
    <circle cx="215" cy="183" r="2"/>
    <circle cx="200" cy="178" r="2"/>
    <circle cx="210" cy="178" r="2"/>
    <circle cx="220" cy="180" r="2"/>
    <circle cx="200" cy="188" r="2"/>
    <circle cx="210" cy="188" r="2"/>
    <circle cx="220" cy="186" r="2"/>
  </g>

  <!-- 胞子のう拡大表示（右側にインセット） -->
  <rect x="290" y="100" width="100" height="120"
        fill="#fafafa" stroke="#bdbdbd" stroke-width="1" rx="4"/>
  <text x="340" y="118" text-anchor="middle"
        font-size="11" fill="#555"
        font-family="-apple-system, sans-serif">胞子のうの拡大</text>

  <!-- 葉裏の一部 -->
  <path d="M 305 140 Q 340 130 375 145 Q 340 165 305 155 Z"
        fill="#c5e1a5" stroke="#33691e" stroke-width="1.3"/>
  <!-- 胞子のうの集まり（拡大） -->
  <g fill="#5d4037" stroke="#3e2723" stroke-width="0.6">
    <circle cx="320" cy="143" r="4"/>
    <circle cx="332" cy="140" r="4"/>
    <circle cx="345" cy="142" r="4"/>
    <circle cx="357" cy="146" r="4"/>
    <circle cx="325" cy="153" r="4"/>
    <circle cx="340" cy="155" r="4"/>
    <circle cx="353" cy="153" r="4"/>
  </g>
  <!-- 胞子（さらに拡大、小粒）-->
  <g fill="#8d6e63" stroke="none">
    <circle cx="320" cy="195" r="2"/>
    <circle cx="328" cy="200" r="2"/>
    <circle cx="335" cy="195" r="2"/>
    <circle cx="343" cy="200" r="2"/>
    <circle cx="350" cy="195" r="2"/>
  </g>
  <text x="340" y="215" text-anchor="middle"
        font-size="10" fill="#555"
        font-family="-apple-system, sans-serif">胞子</text>
</svg>
